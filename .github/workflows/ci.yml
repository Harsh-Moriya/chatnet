name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only needs to check out code.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ##### Backend #####
  # The integration tests start Postgres and Redis in Docker through Testcontainers.
  # GitHub's Ubuntu runners ship with Docker, so no service containers are declared here.
  backend:
    name: Backend (build, test, package check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Fails the job when any direct or transitive NuGet package has a known vulnerability.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable packages found."
            exit 1
          fi

  # ##### Frontend #####
  frontend:
    name: Frontend (lint, test, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what the lockfile says and fails if it is out of sync.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks the whole project, then bundles.
      - name: Build
        run: npm run build

      # Only runtime dependencies: they ship to users. High severity and above fails the job.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  # ##### Docker #####
  # Builds the three images the production stack is made of, without pushing them, and checks the files that describe
  # the stack, so a Dockerfile, the compose file or the Caddyfile that stops working is found here and not on a server.
  docker:
    name: Docker (images, compose file, proxy configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The example values are placeholders; this only shows that the file reads and that every setting it needs has a name.
      - name: Check the production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Build the API image
        run: docker build --target api --tag chatnet-api backend

      - name: Build the migration job image
        run: docker build --target migrate --tag chatnet-migrate backend

      - name: Build the web image
        run: docker build --file frontend/Dockerfile --tag chatnet-web .

      - name: Check the proxy configuration
        run: docker run --rm --env SITE_ADDRESS=chat.example.com chatnet-web caddy validate --config /etc/caddy/Caddyfile

      # Caddy warns on every start about a Caddyfile that is not in its own format; this exits 1 and prints the
      # difference when it is not.
      - name: Check that the Caddyfile is formatted
        run: docker run --rm chatnet-web caddy fmt --diff /etc/caddy/Caddyfile

      # Starts the web image alone and checks the headers, the single page's fallback, caching, compression, HSTS only
      # for public host names, and that the SignalR access token is not written to the log.
      - name: Smoke test the web server
        run: sh deploy/smoke-test.sh chatnet-web

      # The images are also built for ARM64 so the same stack runs on ARM servers. Nothing is emulated: the commands of
      # a build run on this machine and only files are copied into the ARM images.
      - name: Build the API image for ARM64
        run: docker build --platform linux/arm64 --target api --tag chatnet-api:arm64 backend

      - name: Build the migration job image for ARM64
        run: docker build --platform linux/arm64 --target migrate --tag chatnet-migrate:arm64 backend

      - name: Build the web image for ARM64
        run: docker build --platform linux/arm64 --file frontend/Dockerfile --tag chatnet-web:arm64 .

      # An image's platform label comes from the base image it starts from, so only the executables inside show what
      # was really built: the migration bundle is the one that is compiled for a CPU during the build.
      - name: Check which CPU each image's executable is for
        run: |
          sh deploy/check-image-arch.sh chatnet-migrate /app/efbundle amd64
          sh deploy/check-image-arch.sh chatnet-migrate:arm64 /app/efbundle arm64
          sh deploy/check-image-arch.sh chatnet-api /usr/share/dotnet/dotnet amd64
          sh deploy/check-image-arch.sh chatnet-api:arm64 /usr/share/dotnet/dotnet arm64
          sh deploy/check-image-arch.sh chatnet-web /usr/bin/caddy amd64
          sh deploy/check-image-arch.sh chatnet-web:arm64 /usr/bin/caddy arm64
