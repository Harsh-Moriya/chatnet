# Production only. A relay forwards to whatever address a caller names, so without these ranges any signed-in person could use it to
# reach the machine it runs on and the network behind it (the cloud metadata address 169.254.169.254 among them).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits, so one person or one burst cannot take the host's bandwidth or its relay ports. The quotas count allocations, and a browser makes
# one for each network interface it has (and again for every ICE restart) which lasts ten minutes unless it is closed: per credential 12,
# in all 300 (the size of the relay port range). Bytes per second for one allocation and for all of them: 4 Mbit/s and 200 Mbit/s.
user-quota=12
total-quota=300
max-bps=500000
bps-capacity=25000000
