# The settings of the TURN server that every deployment shares (docker-compose.yml and docker-compose.prod.yml mount this file).
# The secret, and in production the address behind the NAT, are added by start.sh from the environment.

listening-port=3478

# The relay ports. Each allocation takes one, and a browser makes one for every network interface it has, so a relayed call uses a handful:
# the range is a few dozen relayed calls at once. Production opens it on the host's firewall and in the cloud security group; the
# development container does not publish it (two browsers on one machine reach each other directly, and a forced relay goes through
# the relay's own ports inside the container).
min-port=49160
max-port=49459

# Credentials are made by the API from a shared secret and expire (the TURN REST scheme): no user database.
use-auth-secret
realm=chatnet

fingerprint
no-tls
no-tcp-relay
no-multicast-peers
no-software-attribute
log-file=stdout
pidfile=/tmp/turnserver.pid
simple-log
