# The whole application as one stack, for a single machine (a VPS). Nothing in it is published except Caddy's ports
# 80 and 443 and the TURN server's (3478 and its relay range, see below); Postgres, Redis and the API instances are reachable
# only from each other.
#
#   cp .env.prod.example .env.prod      (fill in every value)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# docker-compose.yml next to this file is the development setup (infrastructure only, ports open, a Jaeger and an
# object store). This file does not extend it.

# A project name of its own keeps this stack's containers, network and volumes apart from the development stack
# in docker-compose.yml, which is also called chatnet: without it the two would share the database volume.
name: chatnet-prod

services:

  # ##### Postgres #####
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ##### Redis #####
  # The SignalR backplane and presence. A password is required, and the data is written to disk so a restart does
  # not forget who was online (presence rebuilds itself within a minute either way).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The password is read from the environment by the shell, so it is not part of the process's command line.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}

  # ##### Migration #####
  # Applies the database migrations and exits. The API instances wait for it to finish, so several of them starting at
  # once never change the schema at the same time. It is built from the same sources as the API, so the two always agree.
  #
  # "Gss Encryption Mode=Disable" in the connection strings (here and in the api service): the database driver otherwise
  # looks for the Kerberos library on its first connection, the slim images do not have it, and the process writes
  # "Cannot load library libgssapi_krb5.so.2" to its error output. Postgres here uses a password, not Kerberos.
  migrate:
    build:
      context: ./backend
      target: migrate
    image: chatnet-migrate:${CHATNET_VERSION:-local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable

  # ##### API #####
  # API_REPLICAS instances share the work. They find each other through Redis (SignalR backplane, presence), so a
  # message sent through one reaches a client connected to another. Caddy sends a browser to one instance and keeps it
  # there (see deploy/Caddyfile).
  api:
    build:
      context: ./backend
      target: api
    image: chatnet-api:${CHATNET_VERSION:-local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env.prod}
      # The public address of the site. CORS is not used (one origin), but the setting is still checked.
      Frontend__Url: https://${DOMAIN:?set DOMAIN in .env.prod}
      # Requests for any other host name are refused. localhost stays for the container's own health check.
      AllowedHosts: ${ALLOWED_HOSTS:-${DOMAIN};localhost}
      # Caddy is the only thing that can reach the API, from the network this stack runs on. Its word about the
      # client's address and scheme is believed; nobody else's is.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL:?set STORAGE_SERVICE_URL in .env.prod}
      Storage__Bucket: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env.prod}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env.prod}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env.prod}
      # Where traces are sent. Empty, the default, exports nothing. With --profile tracing, set it to http://jaeger:4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The keys that identify the server to the push services of the browsers (see .env.prod.example). Empty, the default,
      # switches alerts for closed browsers off: the page does not offer them and nothing is pushed.
      Push__PublicKey: ${PUSH_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-}
      # The mail relay the password reset email goes through (see .env.prod.example). Without a host, the default, email is off: the
      # app works as before and asking for a reset link answers that it is not available.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__From__Address: ${MAIL_FROM_ADDRESS:-}
      Email__From__Name: ${MAIL_FROM_NAME:-ChatNET}
      # The relay calls go through when two browsers cannot reach each other (see the coturn service). The API makes a short-lived credential
      # for each person from the secret it shares with it. The relay is on this machine, at the same name as the site.
      Turn__Secret: ${TURN_SECRET:?set TURN_SECRET in .env.prod}
      Turn__Urls__0: "turn:${DOMAIN}:3478?transport=udp"
      Turn__Urls__1: "turn:${DOMAIN}:3478?transport=tcp"
      Turn__StunUrls__0: "stun:${DOMAIN}:3478"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ##### Caddy #####
  # The page, the way in to the API, and the certificate. Its certificates and account are kept in a volume: without
  # it every restart would ask for new ones and the certificate authority limits how often that may happen.
  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    image: chatnet-web:${CHATNET_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ##### coturn #####
  # The TURN server that relays a call when the two browsers cannot reach each other. It runs on the machine's own network: the
  # relay uses a port for each leg of a call, and giving those to Docker to forward one by one costs more than it is worth, and
  # would hide the address of the caller from the limits. So it publishes nothing through Docker; the machine's firewall and
  # the cloud security group must allow 3478 (UDP and TCP) and 49160 to 49459 (UDP) from anywhere. Nothing else of this stack is
  # reachable from it by design: calls to private addresses are refused (docker/turn/hardened.conf).
  #
  # TURN_EXTERNAL_IP is "public address/private address" of this machine: on a cloud VM the public one is only forwarded to it.
  # The secret is the one the API makes credentials with (Turn__Secret above).
  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/etc/chatnet-turn/start.sh"]
    environment:
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env.prod}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env.prod, as public-address/private-address}
    volumes:
      - ./docker/turn:/etc/chatnet-turn:ro
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    # The server's binary carries a file capability, which a container that drops them all cannot run.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ##### Jaeger (optional) #####
  # Only with --profile tracing. Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 in .env.prod to send the API's
  # traces to it. Its page listens on the machine's own loopback address only; reach it with an ssh tunnel
  # (ssh -L 16686:localhost:16686 user@host), never through the internet.
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
